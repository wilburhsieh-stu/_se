<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 Cloudflare 網站</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin-top: 10vh; background-color: #f9fafb; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { color: #f38020; /* Cloudflare 橘色 */ }
    button { background-color: #f38020; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    button:hover { background-color: #d66b15; }
    #result { margin-top: 20px; font-weight: bold; color: #333; }
  </style>
</head>
<body>
  <div class="container">
    <h1>從零開發到全球上線 🚀</h1>
    <p>這是一個架設在 Cloudflare Pages 的全端應用程式。</p>
    <button id="api-btn">呼叫無伺服器 API</button>
    <p id="result"></p>
  </div>

  <script>
    document.getElementById('api-btn').addEventListener('click', async () => {
      const resultElement = document.getElementById('result');
      resultElement.innerText = "載入中...";
      try {
        const response = await fetch('/api/hello');
        const data = await response.json();
        resultElement.innerText = data.message;
      } catch (error) {
        resultElement.innerText = "API 呼叫失敗，請確認後端設定。";
      }
    });
  </script>
</body>
</html>
