server {
    listen 80;

    # 處理靜態網頁 (首頁)
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # 將帶有 /api 的請求代理轉發給後端 Flask 容器
    location /api/ {
        proxy_pass http://api:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
